[package]
name = "cassa-fiera"
version = "0.1.0"
description = "Cassa per la vendita di libri e altri prodotti alle fiere"
edition = "2021"

[lib]
# Il nome della libreria è diverso da quello del pacchetto per evitare
# un conflitto noto su Windows tra eseguibile e libreria.
name = "cassa_fiera_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-http = "~2.7"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
