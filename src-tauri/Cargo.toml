[package]
name = "cassa-fiera"
version = "0.1.0"
description = "Cassa per la vendita di libri e altri prodotti alle fiere"
edition = "2021"

[lib]
# Il nome della libreria è diverso da quello del pacchetto per evitare
# un conflitto noto su Windows tra eseguibile e libreria.
name = "cassa_fiera_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-http = "~2.7" # la parte JavaScript di questo plugin è ferma alla 2.7: le due devono coincidere
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
# Sincronizzazione tra casse
tiny_http = "0.12"
mdns-sd = "0.21"
if-addrs = "0.15"
ureq = "2"
# Invio del report via email (TLS senza OpenSSL, così compila uguale su Windows e macOS)
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "hostname", "rustls-tls"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
